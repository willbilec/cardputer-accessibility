[platformio]
default_envs = unified
core_dir = ../Launcher/.pio/core
build_cache_dir = .pio/buildcache

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = 115200
extra_scripts = pre:prepare.py
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DSPEECH_OUTPUT_CHANNEL=1
    -Os
    -I include
    -I generated
    -I ../speech-prototype/src
    -I "${platformio.core_dir}/packages/framework-arduinoespressif32/libraries/Network/src"
lib_ldf_mode = deep+
lib_deps =
    symlink://../M5Cardputer
    symlink://../M5Unified
    symlink://../M5GFX
    symlink://../arduino-espeak-ng
    symlink://../arduino-posix-fs
    symlink://../arduino-audio-tools

[env:accessible-media-player]
build_src_filter = +<speech.cpp> +<player.cpp>
lib_deps =
    ${env.lib_deps}
    https://github.com/earlephilhower/ESP8266Audio.git#2.4.2

[env:offline-test-launcher]
build_src_filter = +<speech.cpp> +<launcher.cpp>

; Emulator-only workload. This is not the distributable Cardputer player.
[env:emulator-workload]
extends = env:accessible-media-player
build_src_filter = +<speech.cpp> +<emulator_workload.cpp>
build_flags =
    ${env.build_flags}
    -DSPEECH_EMULATOR_OUTPUT=1
    -DBENCH_EXTRA_RESERVE=0

[env:emulator-klatt]
extends = env:emulator-workload
build_src_filter = +<klatt_speech.cpp> +<emulator_workload.cpp>
build_flags =
    ${env:emulator-workload.build_flags}
    -DREADER_KLATT=1
lib_deps =
    https://github.com/earlephilhower/ESP8266Audio.git#2.4.2

[env:headless-klatt-player]
build_src_filter = +<klatt_speech.cpp> +<headless_board.cpp> +<headless_player.cpp>
build_flags =
    ${env.build_flags}
    -DREADER_KLATT=1
    -DREADER_HEADLESS=1
lib_deps =
    https://github.com/earlephilhower/ESP8266Audio.git#2.4.2

[env:headless-klatt-launcher]
extends = env:headless-klatt-player
build_src_filter = +<klatt_speech.cpp> +<headless_board.cpp> +<catalogue_launcher.cpp>
lib_deps =

[env:accessible-hid]
extends = env:headless-klatt-player
build_src_filter = +<klatt_speech.cpp> +<headless_board.cpp> +<hid_app.cpp> +<hid_transport.cpp>
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    ${env:headless-klatt-player.build_flags}
    -DARDUINO_USB_MODE=0
lib_deps =

[env:key-learning]
extends = env:headless-klatt-player
build_src_filter = +<klatt_speech.cpp> +<headless_board.cpp> +<key_learning_app.cpp>
lib_deps =

; Diagnostic-only images. Never included in the SD catalogue.
[env:emulator-stress]
extends = env:emulator-klatt
build_src_filter = +<klatt_speech.cpp> +<emulator_stress.cpp>

[env:emulator-ble]
extends = env:emulator-klatt
build_src_filter = +<klatt_speech.cpp> +<emulator_ble.cpp>
lib_deps =

[env:emulator-board-probe]
extends = env:headless-klatt-player
build_src_filter = +<headless_board.cpp> +<emulator_board_probe.cpp>
build_flags =
    ${env:headless-klatt-player.build_flags}
    -DHEADLESS_STARTUP_TRACE=1
lib_deps =

[env:emulator-i2s-control]
extends = env:emulator-board-probe
build_src_filter = +<emulator_i2s_control.cpp>

[env:velxio-audio-compare]
extends = env:key-learning
build_src_filter = +<headless_board.cpp> +<klatt_speech.cpp> +<velxio_audio_compare.cpp>

[env:velxio-audio-pipeline]
extends = env:velxio-audio-compare
build_flags =
    ${env:key-learning.build_flags}
    -DREADER_PIPELINED_AUDIO=1

[env:backgroundaudio-minimal]
build_src_filter = +<backgroundaudio_minimal.cpp>
build_unflags = -Os
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -O3
    -I include
    -I "${platformio.core_dir}/packages/framework-arduinoespressif32/libraries/Network/src"
lib_deps =
    symlink://generated/backgroundaudio-trial

[env:backgroundaudio-coexist]
extends = env:backgroundaudio-minimal
build_src_filter = +<backgroundaudio_coexist.cpp>
build_flags =
    ${env:backgroundaudio-minimal.build_flags}
    -I generated

; The connected development unit uses the existing reader factory partition.
[env:unified-dev]
extends = env:backgroundaudio-minimal
board_build.partitions = partitions.csv
board_build.app_partition_name = reader
board_upload.maximum_size = 2621440
build_src_filter = +<unified.cpp> +<headless_board.cpp> +<unified_hid.cpp> +<usb_file_server.cpp> +<synth.cpp> +<media_decoder.cpp>
build_unflags = -O3 -DARDUINO_USB_MODE=1
build_flags =
    ${env:backgroundaudio-minimal.build_flags}
    -Os
    -DARDUINO_USB_MODE=0
    -DUNIFIED_DIAGNOSTICS=1
    -DUNIFIED_RESERVED_PHONEMES=1
    -DUNIFIED_BIBLE_TEMPO=1
    -I generated
lib_deps =
    ${env:backgroundaudio-minimal.lib_deps}

[env:unified]
extends = env:unified-dev
lib_compat_mode = off
extra_scripts = ${env.extra_scripts}
    pre:optimize_vorbis.py
board_build.partitions = partitions-playpalace.csv
board_upload.maximum_size = 8257536
build_src_filter = ${env:unified-dev.build_src_filter} +<playpalace.cpp> +<playpalace_sound.cpp> +<nvda_remote.cpp> +<nvda_tls.cpp> +<micro_vorbis_demux.cpp>
build_flags =
    ${env:backgroundaudio-minimal.build_flags}
    -Os
    -DARDUINO_USB_MODE=0
    -DUNIFIED_RESERVED_PHONEMES=1
    -I generated
    -DUNIFIED_PLAYPALACE=1
    -DUNIFIED_NVDA_REMOTE=1
    -DUNIFIED_WIFI_SD=1
    -DMEDIA_DECODER_VORBIS=1
    -I "$PROJECT_LIBDEPS_DIR/$PIOENV/micro-vorbis/src/tremor"
    -I "$PROJECT_LIBDEPS_DIR/$PIOENV/micro-vorbis/lib/micro-ogg-demuxer/include"
    -I "$PROJECT_LIBDEPS_DIR/$PIOENV/micro-vorbis/lib/micro-ogg-demuxer/src"
    -I "${platformio.core_dir}/packages/framework-arduinoespressif32/libraries/WiFi/src"
    -I "${platformio.core_dir}/packages/framework-arduinoespressif32/libraries/NetworkClientSecure/src"
lib_deps =
    ${env:unified-dev.lib_deps}
    bblanchon/ArduinoJson@7.4.2
    links2004/WebSockets@2.7.1
    NetworkClientSecure
    https://github.com/arduino-libraries/ArduinoBearSSL.git#c2655703a0c0daafa5d476337b493208fb78fd8d
    https://github.com/esphome-libs/micro-vorbis.git#ae1b2225950c584b69db0f5eb962e1baf60ed34a

[env:unified-playpalace]
extends = env:unified
