[platformio]
extra_configs = platformio.ini
core_dir = ../Launcher/.pio/core
build_dir = .pio-access/build
libdeps_dir = .pio-access/libdeps
lib_dir = .pio-access/empty-libs
default_envs = cardulator-access

[env:cardulator-access]
extends = env:cardputer
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages =
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions-access.csv
build_unflags = -Os -std=gnu++11 -std=gnu++14 -std=gnu++17 -std=c++11 -std=c++14 -std=c++17 -fno-rtti
build_flags =
    -std=gnu++2a
    -O3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCARDULATOR_SPEECH=1
    -DCARDULATOR_HEADLESS=1
    -DCARDULATOR_EMULATOR=1
    -DCARDULATOR_COMPACT_UNITS=1
build_src_filter = +<*> -<embedded_units_dat.c>
extra_scripts =
    pre:build_tinyexpr.py
    pre:prepare_access.py
; Upstream bundles Arduino-2.x core libraries in lib/. Use the Arduino-3.x
; framework libraries instead; the two math libraries are built explicitly.
lib_extra_dirs =
lib_deps =
    https://github.com/m5stack/M5Cardputer.git#1.2.0
    symlink://../M5Unified
    symlink://../M5GFX
    symlink://../offline-reader/generated/backgroundaudio-trial
