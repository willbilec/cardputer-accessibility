[platformio]
extra_configs = platformio.ini
core_dir = ../Launcher/.pio/core
build_dir = .pio-access/build
libdeps_dir = .pio-access/libdeps
default_envs = cardex-access

[env:cardex-access]
extends = env:cardputer-adv
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions-access.csv
build_unflags = -Os -DARDUINO_USB_MODE=0
build_flags =
    -O3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCARDEX_SPEECH=1
    -DCARDEX_EMULATOR_DEMO=1
lib_deps =
    https://github.com/m5stack/M5Cardputer.git#1.2.0
    symlink://../M5Unified
    symlink://../M5GFX
    symlink://../offline-reader/generated/backgroundaudio-trial
