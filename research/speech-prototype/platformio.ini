[platformio]
core_dir = ../Launcher/.pio/core
build_cache_dir = .pio/buildcache

[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages = framework-arduinoespressif32-libs @ https://github.com/bmorcelli/myLibBuilder/releases/download/builds/launcher_keyboot_esp32-arduino-libs-20260910-173758.tar.gz
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Os
    -I "${platformio.core_dir}/packages/framework-arduinoespressif32/libraries/Network/src"
lib_ldf_mode = deep+
lib_deps =
    symlink://../M5Cardputer
    symlink://../M5Unified
    symlink://../M5GFX
    symlink://../arduino-espeak-ng
    symlink://../arduino-posix-fs
    symlink://../arduino-audio-tools

[env:cardputer-adv-calculator]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DDEMO_START_CALCULATOR=1

[env:cardputer-adv-timer]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DDEMO_START_TIMER=1
