name: Firmware builder

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  builder-tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyserial==3.5
      - run: python -m unittest discover -s builder -p "test_*.py"
      - if: runner.os == 'Linux'
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iresearch/offline-reader/include research/offline-reader/test/test_playpalace_speech.cpp -o "$RUNNER_TEMP/test_playpalace_speech"
          "$RUNNER_TEMP/test_playpalace_speech"

  firmware:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install platformio==6.2.0 pyserial==3.5
      - run: python builder/build.py release-build --preset standard --check-codecs
      - run: python -c "import sys; from pathlib import Path; sys.path.insert(0,'builder'); from flash import check_layout; check_layout(Path('release-build/partitions.bin').read_bytes())"
      - shell: bash
        run: |
          cp FLASHING.md LICENSE release-build/
          cp -R research/offline-reader/licenses release-build/
          cd release-build
          sha256sum bootloader.bin partitions.bin boot_app0.bin firmware.bin > SHA256SUMS
          zip -r ../cardputer-adv-full-firmware.zip *.bin build.json SHA256SUMS FLASHING.md LICENSE licenses
      - uses: actions/upload-artifact@v4
        with:
          name: universal-firmware
          path: cardputer-adv-full-firmware.zip
          retention-days: 1
          if-no-files-found: error

  windows-package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - run: python -m venv .venv
      - run: .venv/Scripts/python.exe -m pip install -r builder/requirements.txt
      - run: .venv/Scripts/python.exe builder/package_windows.py Cardputer-ADV-Builder-Windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-builder
          path: Cardputer-ADV-Builder-Windows-x64.zip
          retention-days: 1
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [builder-tests, firmware, windows-package]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: universal-firmware
          path: release-assets
      - run: python -m pip install pyserial==3.5
      - run: python builder/catalog.py "$GITHUB_REF_NAME" release-assets/cardputer-adv-full-firmware.zip release-notes.md
      - uses: actions/download-artifact@v4
        with:
          name: windows-builder
          path: release-assets
      - run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/Cardputer-ADV-Builder-Windows-x64.zip \
            release-assets/cardputer-adv-full-firmware.zip \
            --verify-tag --notes-file release-notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

