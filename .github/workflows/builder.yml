name: Firmware builder

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  builder-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pyserial==3.5
      - name: Run builder tests
        run: python -m unittest discover -s builder -p "test_*.py"
      - name: Test firmware input and speech
        if: runner.os == 'Linux'
        run: |
          cd research/offline-reader
          for test in global_shortcuts headless_board playpalace_speech; do
            g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -Itest/headless_fakes "test/test_$test.cpp" -o "$RUNNER_TEMP/test_$test"
            "$RUNNER_TEMP/test_$test"
          done

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache the pinned PlatformIO toolchain
        uses: actions/cache@v5
        with:
          path: |
            workspace/toolchain/packages
            workspace/toolchain/platforms
          key: platformio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('research/offline-reader/platformio.ini', 'builder/requirements.txt') }}
      - run: python -m pip install platformio==6.2.0 pyserial==3.5
      - name: Build and check the release firmware
        shell: bash
        run: |
          log="$RUNNER_TEMP/firmware-build.log"
          for attempt in 1 2 3; do
            if python builder/build.py release-build --preset standard --check-codecs 2>&1 | tee "$log"; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Eqi 'ConnectTimeoutError|ReadTimeoutError|ConnectionResetError|connection to .* timed out|temporary failure in name resolution|could not resolve host|HTTP (502|503|504)' "$log"; then
              exit 1
            fi
            echo "::warning::A dependency download failed. Retrying the firmware build."
            sleep "$((attempt * 10))"
          done
      - run: python -c "import sys; from pathlib import Path; sys.path.insert(0,'builder'); from flash import check_layout; check_layout(Path('release-build/partitions.bin').read_bytes())"
      - shell: bash
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp FLASHING.md LICENSE release-build/
          cp -R research/offline-reader/licenses release-build/
          cd release-build
          sha256sum bootloader.bin partitions.bin boot_app0.bin firmware.bin > SHA256SUMS
          zip -r ../cardputer-adv-full-firmware.zip *.bin build.json SHA256SUMS FLASHING.md LICENSE licenses
      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: universal-firmware
          path: cardputer-adv-full-firmware.zip
          retention-days: 7
          if-no-files-found: error

  windows-package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - run: python -m venv .venv
      - run: .venv/Scripts/python.exe -m pip install -r builder/requirements.txt
      - run: .venv/Scripts/python.exe builder/package_windows.py Cardputer-ADV-Builder-Windows-x64
      - uses: actions/upload-artifact@v6
        with:
          name: windows-builder
          path: Cardputer-ADV-Builder-Windows-x64.zip
          retention-days: 7
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [builder-tests, firmware, windows-package]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: universal-firmware
          path: release-assets
      - run: python -m pip install pyserial==3.5
      - run: python builder/catalog.py "$GITHUB_REF_NAME" release-assets/cardputer-adv-full-firmware.zip release-notes.md
      - uses: actions/download-artifact@v7
        with:
          name: windows-builder
          path: release-assets
      - run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/Cardputer-ADV-Builder-Windows-x64.zip \
            release-assets/cardputer-adv-full-firmware.zip \
            --verify-tag --notes-file release-notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

